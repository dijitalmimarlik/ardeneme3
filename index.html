<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#c4c8ce;font-family:system-ui,sans-serif}
  #bilgi{position:absolute;top:12px;left:12px;right:12px;max-width:520px;color:#fff;font-size:14px;

{ "imports": {

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { ARButton } from 'three/addons/webxr/ARButton.js';

const MODEL_URL = new URLSearchParams(location.search).get('model') || 'model.glb';
const HEDEF_BOYUT = 1; // metre

const bilgiEl = document.getElementById('bilgi');
const durumEl = document.getElementById('durum');
const doluEl = document.getElementById('dolu');
const cubukEl = document.getElementById('cubuk');

// ---------- Durum (HTML + AR içi 3D panel) ----------
const status = { text: 'Model yükleniyor...', pct: 0, error: false, done: false };

const panelCanvas = document.createElement('canvas');
panelCanvas.width = 1024; panelCanvas.height = 256;
const pctx = panelCanvas.getContext('2d');
const panelTex = new THREE.CanvasTexture(panelCanvas);
const panel = new THREE.Mesh(
  new THREE.PlaneGeometry(0.6, 0.15),
  new THREE.MeshBasicMaterial({ map: panelTex, transparent: true, depthTest: false })
);
panel.renderOrder = 999;
panel.visible = false;

function durumGuncelle(text, pct, opts = {}) {
  Object.assign(status, { text, pct, ...opts });
  durumEl.textContent = text;
  durumEl.className = status.error ? 'hata' : '';
  doluEl.style.width = (pct ?? 0) + '%';
  doluEl.style.background = status.error ? '#e53935' : '#4caf50';
  if (status.done && !status.error) cubukEl.style.display = 'none';

  pctx.clearRect(0, 0, 1024, 256);
  pctx.fillStyle = 'rgba(0,0,0,0.75)';
  pctx.fillRect(0, 0, 1024, 256);
  pctx.fillStyle = status.error ? '#ff8a80' : '#fff';
  pctx.font = 'bold 44px sans-serif';
  pctx.textAlign = 'center';
  pctx.fillText(status.text, 512, 100, 960);
  pctx.fillStyle = 'rgba(255,255,255,0.25)';
  pctx.fillRect(112, 150, 800, 40);
  pctx.fillStyle = status.error ? '#e53935' : '#4caf50';
  pctx.fillRect(112, 150, 8 * (pct ?? 0), 40);
  panelTex.needsUpdate = true;
}
durumGuncelle(status.text, 0);

// ---------- Sahne ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 50);
camera.position.set(0, 0, 2.2);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);

// ---------- PC (fare / dokunmatik): model kendi merkezi etrafında döner ----------
// Sol tuş sürükle = çevir | sağ tuş (veya Shift) sürükle = taşı | tekerlek = zoom | çift tık = sıfırla
// Dokunmatik: tek parmak = çevir, iki parmak = taşı + zoom
const XEKSEN = new THREE.Vector3(1, 0, 0);
const cv = renderer.domElement;
cv.style.touchAction = 'none';
cv.addEventListener('contextmenu', e => e.preventDefault());
const ptrs = new Map();
const pcAktif = () => !renderer.xr.isPresenting;
function panYap(dx, dy) {
  const dist = camera.position.distanceTo(pivot.position);
  const f = 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / innerHeight;
  pivot.position.x += dx * f;
  pivot.position.y -= dy * f;
}
function zoomYap(k) {
  pivot.scale.setScalar(THREE.MathUtils.clamp(pivot.scale.x * k, 0.02, 30));
}
cv.addEventListener('pointerdown', e => {
  if (!pcAktif()) return;
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, b: e.button });
});
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p || !pcAktif()) return;
  if (ptrs.size === 1) {
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (p.b === 2 || p.b === 1 || e.shiftKey) panYap(dx, dy);
    else {
      pivot.rotateOnWorldAxis(YEKSEN, dx * 0.008);   // sağa sürükle = model sağa döner
      pivot.rotateOnWorldAxis(XEKSEN, dy * 0.008);   // aşağı sürükle = model aşağı döner
    }
    p.x = e.clientX; p.y = e.clientY;
  } else if (ptrs.size === 2) {
    const once = [...ptrs.values()].map(q => ({ x: q.x, y: q.y }));
    p.x = e.clientX; p.y = e.clientY;
    const sonra = [...ptrs.values()];
    panYap((sonra[0].x + sonra[1].x - once[0].x - once[1].x) / 2,
           (sonra[0].y + sonra[1].y - once[0].y - once[1].y) / 2);
    const dO = Math.hypot(once[0].x - once[1].x, once[0].y - once[1].y);
    const dS = Math.hypot(sonra[0].x - sonra[1].x, sonra[0].y - sonra[1].y);
    if (dO > 0) zoomYap(dS / dO);
  }
});
const birak = e => ptrs.delete(e.pointerId);
cv.addEventListener('pointerup', birak);
cv.addEventListener('pointercancel', birak);
cv.addEventListener('wheel', e => {
  if (!pcAktif()) return;
  e.preventDefault();
  zoomYap(Math.exp(-e.deltaY * 0.001));
}, { passive: false });
cv.addEventListener('dblclick', () => { if (pcAktif()) sifirla(); });

document.body.appendChild(ARButton.createButton(renderer, {
  requiredFeatures: ['hit-test'],
  optionalFeatures: ['hand-tracking', 'local-floor']
}));

scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.6));
const dir = new THREE.DirectionalLight(0xffffff, 1.5);
dir.position.set(1, 3, 2);
scene.add(dir);
scene.add(panel);

// döndürme merkezi işareti (yalnızca çevirirken görünür)
const merkezIsareti = new THREE.Mesh(
  new THREE.SphereGeometry(1, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xffd54f, depthTest: false, transparent: true, opacity: 0.9 })
);
merkezIsareti.renderOrder = 998;
merkezIsareti.visible = false;
scene.add(merkezIsareti);

// pivot: model merkezinden döner ve ölçeklenir
const pivot = new THREE.Group();
scene.add(pivot);

// Döndürme merkezi modları:
//  'kirpilmis' = uç değerleri (%1-%99) atarak görünen geometrinin ortası (varsayılan; uzak/gizli parçalardan etkilenmez)
//  'kutu'      = görünen geometrinin sınır kutusunun ortası
//  'agirlik'   = köşe noktalarının ortalaması (kütle merkezi gibi)
const MERKEZ_MODU = 'kirpilmis';

function gorunenNoktalar(obj) {
  obj.updateMatrixWorld(true);
  const liste = [], v = new THREE.Vector3();
  const gorunur = m => {
    for (let o = m; o; o = o.parent) { if (!o.visible) return false; if (o === obj) break; }
    return true;
  };
  obj.traverse(m => {
    if (!m.isMesh || !m.geometry.attributes.position || !gorunur(m)) return;
    const pos = m.geometry.attributes.position;
    const adim = Math.max(1, Math.floor(pos.count / 20000));
    for (let i = 0; i < pos.count; i += adim) {
      v.fromBufferAttribute(pos, i).applyMatrix4(m.matrixWorld);
      liste.push(v.x, v.y, v.z);
    }
  });
  return liste;
}

function merkezVeBoyut(obj) {
  const p = gorunenNoktalar(obj);
  if (!p.length) {
    const box = new THREE.Box3().setFromObject(obj, true);
    return { center: box.getCenter(new THREE.Vector3()), size: box.getSize(new THREE.Vector3()) };
  }
  const n = p.length / 3;
  const mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity], top = [0, 0, 0];
  for (let i = 0; i < p.length; i++) {
    const k = i % 3;
    if (p[i] < mn[k]) mn[k] = p[i];
    if (p[i] > mx[k]) mx[k] = p[i];
    top[k] += p[i];
  }
  const c = [0, 0, 0];
  for (let k = 0; k < 3; k++) {
    if (MERKEZ_MODU === 'agirlik') c[k] = top[k] / n;
    else if (MERKEZ_MODU === 'kirpilmis' && n > 100) {
      const d = new Float32Array(n);
      for (let i = 0; i < n; i++) d[i] = p[i * 3 + k];
      d.sort();
      c[k] = (d[Math.floor(n * 0.01)] + d[Math.ceil(n * 0.99) - 1]) / 2;
    } else c[k] = (mn[k] + mx[k]) / 2;
  }
  return {
    center: new THREE.Vector3(c[0], c[1], c[2]),
    size: new THREE.Vector3(mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2])
  };
}
let fitScale = 1;   // modeli HEDEF_BOYUT'a sığdıran çarpan; gerçek boyut = pivot ölçeği 1/fitScale
function pivotaEkle(obj) {
  pivot.clear();
  const { center, size } = merkezVeBoyut(obj);
  const s = HEDEF_BOYUT / Math.max(size.x, size.y, size.z, 1e-6);
  obj.position.sub(center);
  const kap = new THREE.Group();
  kap.add(obj);
  kap.scale.setScalar(s);
  fitScale = s;
  pivot.add(kap);
}

function demoKup() {
  pivotaEkle(new THREE.Mesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({ color: 0x4caf50 })
  ));
}

// ---------- Model yükleme (ilerleme çubuğu + ayrıntılı hata teşhisi) ----------
const loader = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
loader.setDRACOLoader(draco);
loader.setMeshoptDecoder(MeshoptDecoder);

function hataGoster(mesaj) {
  console.error(mesaj);
  bilgiEl.style.display = 'block';
  demoKup();
  durumGuncelle('HATA: ' + mesaj, 100, { error: true, done: true });
  panel.visible = true;
}

async function glbCoz(buf, taban) {
  const bas = new TextDecoder().decode(new Uint8Array(buf, 0, Math.min(24, buf.byteLength)));
  if (bas.startsWith('version https://git-lfs')) throw new Error('Dosya Git LFS işaretçisi, gerçek GLB değil');
  if (bas.trimStart().startsWith('<')) throw new Error('Sunucu HTML döndürdü (dosya yolu yanlış olabilir)');
  if (!bas.startsWith('glTF')) throw new Error('Dosya geçerli bir .glb değil (.gltf ise .glb\'ye çevirin)');
  const g = await loader.parseAsync(buf, taban);
  pivotaEkle(g.scene);
  durumGuncelle('Model hazır ✓', 100, { done: true, error: false });
  cubukEl.style.display = 'none';
  bilgiEl.style.display = 'none';       // model sorunsuz yüklendi: bilgi kutusu görünmesin
  setTimeout(() => { if (!status.error) panel.visible = false; }, 3000);
}

async function modelYukle(url) {
  try {
    bilgiEl.style.display = 'block';
    durumGuncelle('Model yükleniyor %0', 0, { done: false, error: false });
    cubukEl.style.display = 'block';
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${new URL(url, location.href).href} adresinde dosya yok`);
    const toplam = +r.headers.get('content-length') || 0;
    const okuyucu = r.body.getReader();
    const parcalar = [];
    let yuklenen = 0;
    for (;;) {
      const { done, value } = await okuyucu.read();
      if (done) break;
      parcalar.push(value);
      yuklenen += value.length;
      if (toplam) {
        const p = Math.min(99, Math.round(yuklenen / toplam * 100));
        durumGuncelle(`Model yükleniyor %${p}`, p);
      } else {
        durumGuncelle(`Model yükleniyor ${(yuklenen / 1048576).toFixed(1)} MB`, 50);
      }
    }
    const buf = new Uint8Array(yuklenen);
    let o = 0;
    for (const p of parcalar) { buf.set(p, o); o += p.length; }
    durumGuncelle('Model işleniyor...', 99);
    await glbCoz(buf.buffer, url.substring(0, url.lastIndexOf('/') + 1));
  } catch (e) {
    hataGoster(e.message || String(e));
  }
}
modelYukle(MODEL_URL);

// Bilgisayardan dosya seçerek deneme
document.getElementById('dosya').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    bilgiEl.style.display = 'block';
    durumGuncelle('Dosya okunuyor...', 50, { done: false, error: false });
    await glbCoz(await f.arrayBuffer(), '');
  } catch (err) { hataGoster(err.message || String(err)); }
});

// ---------- Yerleştirme halkası ----------
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.07, 0.09, 32).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xffffff })
);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

// ---------- Tutucular: kumandalar + el pinch'leri ----------
let placed = true;      // false iken halka aranır, Trigger/pinch ile yere konur
let d0 = 1, s0 = 1;
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
const pNow = new THREE.Vector3(), qNow = new THREE.Quaternion(), qDelta = new THREE.Quaternion(), qInv = new THREE.Quaternion();
const YEKSEN = new THREE.Vector3(0, 1, 0);
const sagEksen = new THREE.Vector3(1, 0, 0), qView = new THREE.Quaternion();
let sonT = 0;
const ROT_GAIN = 3;        // kumanda: ışın açısı -> model dönüşü çarpanı
const HAND_ROT_GAIN = 8;   // sağ el: metre başına radyan
const fTmp = new THREE.Vector3();
function isinAci(q, out) {
  fTmp.set(0, 0, -1).applyQuaternion(q);
  out.yaw = Math.atan2(fTmp.x, -fTmp.z);
  out.pitch = Math.asin(THREE.MathUtils.clamp(fTmp.y, -1, 1));
}
// quaternion'un dünya Y ekseni etrafındaki (yatay) bileşeni; diğer dönüşler etkilenmez
function yawAci(q) {
  if (Math.hypot(q.y, q.w) < 1e-4) return null;
  return 2 * Math.atan2(q.y, q.w);
}
const twistQ = new THREE.Quaternion(), homeTw = new THREE.Quaternion(), homeSw = new THREE.Quaternion(), hedefQ = new THREE.Quaternion();
const aciA = { yaw: 0, pitch: 0 }, aciB = { yaw: 0, pitch: 0 };
const acifark = (a, b) => THREE.MathUtils.euclideanModulo(a - b + Math.PI, 2 * Math.PI) - Math.PI;
const homePos = new THREE.Vector3(), homeQ = new THREE.Quaternion();
let homeScale = 1;
function sifirla() {
  pivot.position.copy(homePos);
  pivot.quaternion.copy(homeQ);
  pivot.scale.setScalar(homeScale);
}

function lazerYap() {
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.003, 0.003, 1.5, 8), mat);
  cyl.rotation.x = Math.PI / 2;
  cyl.position.z = -0.75;
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.01, 12, 12), mat);
  tip.position.z = -1.5;
  g.add(cyl, tip);
  g.userData.mat = mat;
  return g;
}

const controllers = [0, 1].map(i => {
  const c = renderer.xr.getController(i);
  c.userData.grabbing = false;
  c.userData.isHand = false;
  scene.add(c);
  c.addEventListener('connected', e => {
    c.userData.isHand = !!e.data.hand;
    if (!c.userData.isHand && !c.userData.laser) {
      c.userData.laser = lazerYap();
      c.add(c.userData.laser);
    }
    if (c.userData.laser) c.userData.laser.visible = !c.userData.isHand;
  });
  c.userData.rot = false;   // tetik: döndür
  c.userData.mov = false;   // grip: taşı
  c.userData.prevQ = new THREE.Quaternion();
  c.userData.prevP = new THREE.Vector3();
  const baslatEylem = tur => {
    if (c.userData.isHand) return;
    if (!placed) { zemineYerlestir(); return; }
    c.updateMatrixWorld(true);
    c.getWorldQuaternion(c.userData.prevQ);
    c.getWorldPosition(c.userData.prevP);
    c.userData[tur] = true;
    laserRenk(c);
  };
  const bitirEylem = tur => { c.userData[tur] = false; laserRenk(c); };
  c.addEventListener('selectstart', () => baslatEylem('rot'));   // tetik: çevir
  c.addEventListener('selectend', () => bitirEylem('rot'));
  c.addEventListener('squeezestart', () => baslatEylem('mov'));  // grip: taşı
  c.addEventListener('squeezeend', () => bitirEylem('mov'));
  return c;
});

// El takibi: pinch algılama kendi kodumuzla yapılır
const hands = [0, 1].map(i => {
  const hand = renderer.xr.getHand(i);
  hand.userData.active = false;
  hand.addEventListener('connected', e => { hand.userData.active = true; hand.userData.side = e.data.handedness; });
  hand.addEventListener('disconnected', () => hand.userData.active = false);
  scene.add(hand);

  const proxy = new THREE.Object3D();      // pinch noktası
  proxy.userData.pinch = false;
  proxy.userData.prevQ = new THREE.Quaternion();
  proxy.userData.prevP = new THREE.Vector3();
  proxy.userData.hand = hand;
  proxy.userData.gosterge = new THREE.Mesh(
    new THREE.SphereGeometry(0.012, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  proxy.add(proxy.userData.gosterge);
  proxy.visible = false;
  scene.add(proxy);
  return proxy;
});

const tutucular = [...controllers, ...hands];
const MOVE_GAIN = 2;      // taşıma hızı çarpanı (grip ve sol el)
let zoomAktif = false;

function zemineYerlestir() {
  if (!reticle.visible) return;
  pivot.position.setFromMatrixPosition(reticle.matrix);
  pivot.position.y += 0.02;
  pivot.quaternion.identity();
  placed = true;
}

function laserRenk(g) {
  const u = g.userData;
  if (u.laser) u.laser.userData.mat.color.set(u.rot ? 0xffa726 : u.mov ? 0x4cff6a : 0xffffff);
  if (u.gosterge) u.gosterge.material.color.set(!u.pinch ? 0xffffff : (u.hand.userData.side === 'left' ? 0x4cff6a : 0xffa726));
}

function elleriGuncelle() {
  hands.forEach(proxy => {
    const u = proxy.userData, hand = u.hand;
    const th = hand.joints && hand.joints['thumb-tip'];
    const ix = hand.joints && hand.joints['index-finger-tip'];
    const wr = hand.joints && hand.joints['wrist'];
    const ok = hand.userData.active && th && ix && wr && th.visible && ix.visible && wr.visible;
    if (!ok) {
      proxy.visible = false;
      if (u.pinch) { u.pinch = false; laserRenk(proxy); }
      return;
    }
    proxy.visible = true;
    proxy.position.copy(th.position).add(ix.position).multiplyScalar(0.5);
    proxy.quaternion.copy(wr.quaternion);
    const d = th.position.distanceTo(ix.position);
    if (!u.pinch && d < 0.025) {
      if (!placed) zemineYerlestir();
      else { u.pinch = true; u.prevQ.copy(proxy.quaternion); u.prevP.copy(proxy.position); laserRenk(proxy); }
    } else if (u.pinch && d > 0.045) { u.pinch = false; laserRenk(proxy); }
  });

  const aktif = hands.filter(h => h.userData.pinch);
  if (aktif.length === 2) {                 // iki el: zoom
    const d = aktif[0].position.distanceTo(aktif[1].position);
    if (!zoomAktif) { zoomAktif = true; d0 = Math.max(0.01, d); s0 = pivot.scale.x; }
    pivot.scale.setScalar(THREE.MathUtils.clamp(s0 * d / d0, 0.02, 30));
  } else {
    zoomAktif = false;
    aktif.forEach(h => {
      const u = h.userData;
      if (hand_sag(h)) {                    // sağ el: döndür
        tmpA.copy(h.position).sub(u.prevP);
        pivot.rotateOnWorldAxis(YEKSEN, tmpA.dot(sagEksen) * HAND_ROT_GAIN);
        pivot.rotateOnWorldAxis(sagEksen, -tmpA.y * HAND_ROT_GAIN);
      } else {                              // sol el: taşı
        pivot.position.add(tmpA.copy(h.position).sub(u.prevP).multiplyScalar(MOVE_GAIN));
      }
    });
  }
  aktif.forEach(h => { h.userData.prevQ.copy(h.quaternion); h.userData.prevP.copy(h.position); });
}
const hand_sag = h => h.userData.hand.userData.side !== 'left';

// ---------- Oturum başı: modeli ve paneli kullanıcının önüne koy ----------
let needInit = false;
renderer.xr.addEventListener('sessionstart', () => { needInit = true; });

function baslangicYerlestir(frame) {
  const pose = frame.getViewerPose(renderer.xr.getReferenceSpace());
  if (!pose) return false;
  const t = pose.transform;
  const p = new THREE.Vector3(t.position.x, t.position.y, t.position.z);
  const q = new THREE.Quaternion(t.orientation.x, t.orientation.y, t.orientation.z, t.orientation.w);
  const f = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
  f.y = 0;
  if (f.lengthSq() < 1e-4) f.set(0, 0, -1);
  f.normalize();

  pivot.scale.setScalar(1);
  pivot.quaternion.identity();
  pivot.position.copy(p).addScaledVector(f, 1.0);
  pivot.position.y = p.y - 0.35;

  panel.position.copy(p).addScaledVector(f, 0.9);
  panel.position.y = p.y + 0.15;
  panel.lookAt(p.x, panel.position.y, p.z);
  panel.visible = !status.done || status.error;
  homePos.copy(pivot.position); homeQ.copy(pivot.quaternion); homeScale = 1;
  placed = true;
  return true;
}

let hitSource = null, hitRequested = false;
renderer.xr.addEventListener('sessionend', () => {
  tutucular.forEach(c => { c.userData.pinch = c.userData.rot = c.userData.mov = false; c.userData.say = 0; laserRenk(c); });
  hitSource = null; hitRequested = false; placed = true;
  reticle.visible = false; panel.visible = false;
  pivot.position.set(0, 0, 0); pivot.quaternion.identity(); pivot.scale.setScalar(1);
});

// ---------- Döngü ----------
const btnPrev = {};
renderer.setAnimationLoop((t, frame) => {
  if (frame) {
    const session = renderer.xr.getSession();

    if (needInit && baslangicYerlestir(frame)) needInit = false;

    if (!hitRequested) {
      hitRequested = true;
      session.requestReferenceSpace('viewer')
        .then(space => session.requestHitTestSource({ space }))
        .then(src => hitSource = src)
        .catch(e => console.warn('hit-test yok:', e));
    }

    if (hitSource && !placed) {
      const hits = frame.getHitTestResults(hitSource);
      if (hits.length) {
        reticle.visible = true;
        reticle.matrix.fromArray(hits[0].getPose(renderer.xr.getReferenceSpace()).transform.matrix);
      } else reticle.visible = false;
    } else reticle.visible = false;

    controllers.forEach(c => {
      if (c.userData.isHand || (!c.userData.rot && !c.userData.mov)) return;
      c.updateMatrixWorld(true);
      c.getWorldQuaternion(qNow);
      c.getWorldPosition(pNow);
      if (pivot.parent === scene) {
        if (c.userData.rot) {   // tetik: kumanda dönüşünü modele uygula (trackball)
          isinAci(qNow, aciA);
          isinAci(c.userData.prevQ, aciB);
          const dYaw = acifark(aciA.yaw, aciB.yaw), dPitch = aciA.pitch - aciB.pitch;
          pivot.rotateOnWorldAxis(YEKSEN, dYaw * ROT_GAIN);          // sağa sürükle = model sağa döner
          pivot.rotateOnWorldAxis(sagEksen, -dPitch * ROT_GAIN);     // yukarı sürükle = model yukarı döner
        }
        if (c.userData.mov)     // grip: kumanda konum farkını modele uygula
          pivot.position.add(tmpA.copy(pNow).sub(c.userData.prevP).multiplyScalar(MOVE_GAIN));
      }
      c.userData.prevQ.copy(qNow);
      c.userData.prevP.copy(pNow);
    });

    elleriGuncelle();

    const donuyor = controllers.some(c => c.userData.rot) ||
      (hands.filter(h => h.userData.pinch).length === 1 && hands.some(h => h.userData.pinch && hand_sag(h)));
    merkezIsareti.visible = donuyor;
    merkezIsareti.position.copy(pivot.position);
    merkezIsareti.scale.setScalar(0.008);

    // gözlemcinin bakış yönüne göre "sağ" ekseni (yatay düzlemde)
    const vp = frame.getViewerPose(renderer.xr.getReferenceSpace());
    if (vp) {
      const o = vp.transform.orientation;
      qView.set(o.x, o.y, o.z, o.w);
      sagEksen.set(1, 0, 0).applyQuaternion(qView);
      sagEksen.y = 0;
      if (sagEksen.lengthSq() > 1e-4) sagEksen.normalize(); else sagEksen.set(1, 0, 0);
    }
    const dt = Math.min(0.1, (t - sonT) / 1000 || 0.016);
    sonT = t;

    session.inputSources.forEach(src => {
      const gp = src.gamepad;
      if (!gp) return;
      const x = gp.axes[2] || 0, y = gp.axes[3] || 0;
      // ileri = gözlemci yukarı çıkar (model üstünü gösterir), sağ = gözlemci sağa gider
      if (Math.abs(y) > 0.15)             // ileri = zoom in, geri = zoom out
        pivot.scale.setScalar(THREE.MathUtils.clamp(pivot.scale.x * Math.exp(-y * 1.5 * dt), 0.02, 30));
      if (Math.abs(x) > 0.15) pivot.rotateOnWorldAxis(YEKSEN, -x * 2.5 * dt);
      const b = gp.buttons[5] && gp.buttons[5].pressed;        // B / Y: modeli ilk haline sıfırla
      if (b && !btnPrev[src.handedness + 'B']) sifirla();
      btnPrev[src.handedness + 'B'] = b;
      const basili = gp.buttons[3] && gp.buttons[3].pressed;   // thumbstick tıklaması
      if (basili && !btnPrev[src.handedness]) sifirla();
      btnPrev[src.handedness] = basili;
      const ab = gp.buttons[4] && gp.buttons[4].pressed;   // A / X
      if (ab) {                           // A / X: yaw (yatay dönüş) korunur, diğer eksenler ilk haline döner
        const q = pivot.quaternion;
        if (Math.hypot(q.y, q.w) > 1e-4) {
          twistQ.set(0, q.y, 0, q.w).normalize();                       // mevcut yaw
          homeTw.set(0, homeQ.y, 0, homeQ.w).normalize();
          homeSw.copy(homeTw).invert().multiply(homeQ);                  // ilk halin yaw dışındaki kısmı
          hedefQ.copy(twistQ).multiply(homeSw);
          q.slerp(hedefQ, Math.min(1, 2.5 * dt));
        }
      }
    });
  }
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
